; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = teensymm

[env:teensymm]
platform_packages =
    framework-arduinoteensy@https://github.com/ssilverman/teensy_betas.git#teensy_1.60/framework-arduinoteensy
    tool-teensy@https://github.com/ssilverman/teensy_betas.git#teensy_1.60/tool-teensy/linux64
platform = teensy@^5.1
board = teensymm
framework = arduino
build_flags = -Wformat=1 -DUSB_DUAL_SERIAL -Wno-psabi
lib_extra_dirs = ~/Arduino/libraries
; Unit tests in test/ run on the host only (see [env:native]); none target the board.
test_ignore = *

; Host-side unit tests: pio test -e native
; Compiles the hardware-independent firmware modules listed below against the
; stand-ins in test/native/GevcuHostStubs instead of the Teensy core.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
    -<*>
    +<MemCache.cpp>
    +<PrefHandler.cpp>
    +<FaultHandler.cpp>
    +<CrashHandler.cpp>
    +<intel_hex.cpp>
    +<PID_v1.cpp>
    +<devices/Device.cpp>
    +<devices/io/Throttle.cpp>
    +<devices/esp32/md5_hash.cpp>
build_flags =
    -std=gnu++17
    -Wno-psabi
    -funsigned-char
    -I src
    -I lib/ArduinoJson/src
    -DARDUINOJSON_ENABLE_ARDUINO_STRING=0
    -DARDUINOJSON_ENABLE_ARDUINO_STREAM=0
    -DARDUINOJSON_ENABLE_ARDUINO_PRINT=0
    -DARDUINOJSON_ENABLE_PROGMEM=0
    -DUNITY_INCLUDE_DOUBLE
    -DUNITY_DOUBLE_PRECISION=1e-9
lib_extra_dirs = test/native
lib_deps = GevcuHostStubs
lib_ignore = FlexCAN_T4, WDT_T4, TeensyThreads, TeensyTimerTool, ArduinoJson
lib_compat_mode = off
